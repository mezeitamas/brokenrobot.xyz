name: Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  BROKENROBOT_PORT: 8080

# Every job runs in the same image, by the same digest, as .devcontainer/devcontainer.json — the
# visual baselines must render in one environment locally and in CI. Change both together. Each job
# installs only the tools it names in MISE_ENABLE_TOOLS, at the versions and checksums in mise.lock,
# and puts their real bin directories on PATH: a mise shim cannot resolve a version in a directory
# with no mise.toml, such as the temp checkouts the hook suites run in.
jobs:
  verify-site:
    name: 'Verify site'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/jdx/mise:2026.10.10-debian@sha256:8eb2c479207e09099c9ae401625f0e4782344031fa327cee296cee223193fc07
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MISE_ENABLE_TOOLS: node,npm:@fission-ai/openspec

    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: |
          mise install --locked
          mise bin-paths >> "$GITHUB_PATH"

      - name: Read the Node.js version
        id: node
        run: echo "version=$(node --version)" >> "$GITHUB_OUTPUT"

      - name: Cache npm downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node${{ steps.node.outputs.version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-node${{ steps.node.outputs.version }}-

      - name: Install dependencies
        run: npm ci

      # Every step below carries `if: ${{ !cancelled() }}` so that one failing
      # check does not hide the five after it — stopping at the first failure
      # costs a whole pipeline round trip now that Verify gates Build. The job
      # still concludes `failure`, because the failed step is not excused.
      #
      # Never replace this with `continue-on-error: true`. That forces a step's
      # conclusion to `success`, so the job would pass with a failing check inside
      # it and Deploy's gate would open on broken source.
      #
      # The setup steps above keep the implicit `if: success()`: there is
      # nothing to report when the setup failed. A failed `npm ci` does make all
      # seven run and fail together, which is noisy but not misleading.
      - name: Format check
        if: ${{ !cancelled() }}
        run: npm run format:check

      - name: Lint check
        if: ${{ !cancelled() }}
        run: npm run lint:check

      - name: Type check
        if: ${{ !cancelled() }}
        run: npm run type:check

      - name: OpenSpec validate
        if: ${{ !cancelled() }}
        run: npm run specs:check

      - name: DESIGN lint
        if: ${{ !cancelled() }}
        run: npm run designmd:check

      - name: DESIGN token drift check
        if: ${{ !cancelled() }}
        run: npm run tokens:check

      - name: CSP header sync check
        if: ${{ !cancelled() }}
        run: npm run headers:check

  verify-infrastructure:
    name: 'Verify infrastructure'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/jdx/mise:2026.10.10-debian@sha256:8eb2c479207e09099c9ae401625f0e4782344031fa327cee296cee223193fc07
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MISE_ENABLE_TOOLS: terraform

    # Every step in this job is Terraform, so the directory belongs to the job
    # rather than to each step. A `cd` in a `run:` would not carry — each step
    # starts its own shell. mise finds mise.toml in the parent directory.
    defaults:
      run:
        working-directory: infra/cloudflare

    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: |
          mise install --locked
          mise bin-paths >> "$GITHUB_PATH"

      - name: TerraForm format check
        run: terraform fmt -check -recursive

      - name: TerraForm init
        run: terraform init -backend=false

      - name: TerraForm validate
        run: terraform validate -no-color

  verify-tooling:
    name: 'Verify tooling'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/jdx/mise:2026.10.10-debian@sha256:8eb2c479207e09099c9ae401625f0e4782344031fa327cee296cee223193fc07
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MISE_ENABLE_TOOLS: node,jq

    # No `npm ci`: the hook suites stub the tools they exercise and need only bash, git, and
    # coreutils from the image and node and jq from mise — `npm run` reads package.json without
    # node_modules.
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: |
          mise install --locked
          mise bin-paths >> "$GITHUB_PATH"

      - name: Hook suites
        run: npm run hooks:check

  build-site:
    name: 'Build site'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/jdx/mise:2026.10.10-debian@sha256:8eb2c479207e09099c9ae401625f0e4782344031fa327cee296cee223193fc07
    # The phase rule: if Verify does not pass, Build does not run. This costs
    # wall-clock time — the critical path becomes Verify + Build + Test — and buys
    # never building source already known to be broken.
    needs: [verify-site, verify-infrastructure, verify-tooling]
    timeout-minutes: 10
    env:
      MISE_ENABLE_TOOLS: node

    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: |
          mise install --locked
          mise bin-paths >> "$GITHUB_PATH"

      - name: Read the Node.js version
        id: node
        run: echo "version=$(node --version)" >> "$GITHUB_OUTPUT"

      - name: Cache npm downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node${{ steps.node.outputs.version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-node${{ steps.node.outputs.version }}-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 3

  test-site:
    name: 'Test site'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/jdx/mise:2026.10.10-debian@sha256:8eb2c479207e09099c9ae401625f0e4782344031fa327cee296cee223193fc07
    needs: build-site
    timeout-minutes: 10
    env:
      MISE_ENABLE_TOOLS: node

    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tools
        run: |
          mise install --locked
          mise bin-paths >> "$GITHUB_PATH"

      - name: Read the Node.js version
        id: node
        run: echo "version=$(node --version)" >> "$GITHUB_OUTPUT"

      - name: Cache npm downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node${{ steps.node.outputs.version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-node${{ steps.node.outputs.version }}-

      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Install dependencies
        run: npm ci

      # Both checks read the downloaded `dist/`. `twins:check` imports `yaml`, so
      # both wait for `npm ci` above.
      - name: Third-party resource check
        run: npm run thirdparty:check

      - name: Markdown twin check
        run: npm run twins:check

      - name: Install Playwright Browsers
        run: npm run install:playwright

      - name: E2E test check
        run: node_modules/.bin/playwright test

      - name: Upload e2e test reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-test-reports
          path: reports/tests/e2e/
          retention-days: 3
